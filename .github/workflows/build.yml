name: Android CI - Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Repoda gradlew'in derleme (wrapper) JAR dosyasi commitlenmedi (binary
      # dosya), o yuzden ./gradlew yerine bu action'in kurdugu "gradle"
      # komutunu dogrudan kullaniyoruz - wrapper'a ihtiyac kalmiyor.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: turkuaz-full-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
